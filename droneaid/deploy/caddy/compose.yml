# Standalone Caddy for /opt/caddy, the front door of the VM since the cutover
# (README "Cutover"). It belongs to no app project, so apps can come and go behind it.
#
#   /opt/caddy/compose.yml        this file
#   /opt/caddy/conf/Caddyfile     PART 2 of droneaid/deploy/Caddyfile.snippet
#   /opt/caddy/conf/redirects.caddy
#
# The config directory is mounted, not the single file: editors that replace the file
# (new inode) would otherwise leave the container reading the old one.
# Reload after an edit: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
name: caddy

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    mem_limit: 256m

networks:
  edge:
    external: true

volumes:
  # Created by hand (docker volume create caddy_data caddy_config), so no `down -v`
  # in any project can delete the certificates and the ACME account. On 2026-11-11 they
  # were copied here from AFFiNE's affine_caddy_data / affine_caddy_config.
  caddy_data:
    external: true
    name: caddy_data
  caddy_config:
    external: true
    name: caddy_config
