name: DroneAid deploy

# Fork-only workflow (upstream never has this file, so syncs never conflict).
# Builds our arm64 image natively and rolls it out to the Oracle VM's /opt/docmost.
# Runbook: droneaid/deploy/README.md.
#
# Branch model: work lands on `droneaid`; `production` is promoted from it deliberately,
# and only a push to `production` deploys. `workflow_dispatch` builds any ref; it deploys
# only with `deploy: true`.
#
# Repository secrets (environment `production`):
#   ORACLE_HOST              public IP / hostname of the VM
#   ORACLE_USER              ssh user (ubuntu)
#   ORACLE_SSH_KEY           private key, full PEM including header/footer
#   ORACLE_SSH_KNOWN_HOSTS   known_hosts line(s) pinning the host key
# Repository variable:
#   DEPLOY_URL               public origin checked after the rollout, e.g. https://base.droneaid.fr
#
# The rollout writes only /opt/docmost/.env (DOCMOST_IMAGE=...), keeps .env.previous and
# rolls back on failure. Rollback is image-only and is refused once the new image has run
# a migration (the previous image would not boot); see droneaid/deploy/rollout.sh.
#
# AGPL §13 (droneaid/docs/licence-review.md, finding 2): the deploy job refuses a commit
# that is not on `droneaid` or `production` of this public repo, and tags every commit it
# deployed as deploy/<YYYYMMDD>-<sha7>, so its source stays reachable after a rewrite.

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      deploy:
        description: Also roll the image out to the VM (otherwise build and push only)
        type: boolean
        default: false

permissions: {}

env:
  IMAGE_REPO: ghcr.io/droneaid-fr/docmost

jobs:
  build:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          echo "image=${IMAGE_REPO}:stable-${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arm64 runner: the plain Dockerfile works (the qemu deadlock that
      # droneaid/docker/build-arm64.sh works around only happens under emulation).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # AGPL §13: the commit is baked into the client's "Source code" link and the
          # image's org.opencontainers.image.revision label (source/licenses labels come
          # from the Dockerfile). github.sha is always a commit already pushed to this
          # public repo. NEVER rewrite (force-push, rebase away, delete) a commit that has
          # been deployed: its source must stay reachable while it runs, and after.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          # mode=min: cache only the final image's layers. mode=max also exported the
          # builder stage (full dev node_modules), 99 s of a 3 m 5 s build in run
          # 42872284160, for no hit: `COPY . .` precedes `pnpm install`, so every commit
          # rebuilds the builder and installer stages anyway.
          cache-from: type=gha,scope=docmost-arm64
          cache-to: type=gha,scope=docmost-arm64,mode=min

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: echo "Pushed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Roll out to Oracle VM
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    # Never two rollouts at once, never cancel one midway: an interrupted
    # `compose up` can leave the stack half-recreated.
    concurrency:
      group: droneaid-deploy-production
      cancel-in-progress: false
    permissions:
      contents: write   # the deploy/<date>-<sha7> tag; nothing else is written
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: droneaid/deploy

      - name: Refuse a commit that is not on a public branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          [ "$private" = "false" ] || { echo "::error::${GITHUB_REPOSITORY} is not public: no AGPL source offer"; exit 1; }
          for branch in production droneaid; do
            # base...head with base = our commit: "identical" or "ahead" means the branch contains it.
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${branch}" --jq .status 2>/dev/null || true)"
            case "$status" in
              identical|ahead) echo "${GITHUB_SHA} is on ${branch}"; exit 0 ;;
            esac
          done
          echo "::error::${GITHUB_SHA} is on neither production nor droneaid; merge it there before deploying."
          exit 1

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_URL" ] || { echo "::error::repository variable DEPLOY_URL is not set"; exit 1; }
          [ -n "$ORACLE_SSH_KNOWN_HOSTS" ] || { echo "::error::ORACLE_SSH_KNOWN_HOSTS is not set"; exit 1; }
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/oracle_key
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          # Pin the host key: without this the rollout is trivially MITM-able.
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        id: deploy
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          # Job-scoped token, valid only for this run; lets the VM pull a private
          # package without parking a long-lived PAT on the box.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # First stdin line = token (kept out of argv and off disk), the rest = the
          # script, saved to a temp file before it runs so no command can eat it.
          { printf '%s\n' "$REGISTRY_TOKEN"; cat droneaid/deploy/rollout.sh; } |
            ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ServerAliveInterval=30 "${ORACLE_USER}@${ORACLE_HOST}" \
              "IFS= read -r REGISTRY_TOKEN && export REGISTRY_TOKEN REGISTRY_USER='${REGISTRY_USER}' &&
               s=\$(mktemp) && cat > \"\$s\" && bash \"\$s\" deploy '${IMAGE}'; rc=\$?; rm -f \"\$s\"; exit \$rc"

      - name: Verify the public health endpoint
        id: verify
        run: |
          set -euo pipefail
          url="${DEPLOY_URL%/}/api/health"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 10 "$url" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "Healthy after ${attempt} attempt(s): ${body}"
              exit 0
            fi
            echo "attempt ${attempt}: not healthy yet (${body:-no response}), retrying..."
            sleep 10
          done
          echo "::error::${url} did not report status ok within 5 minutes."
          exit 1

      - name: Tag the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="deploy/$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" 2>&1)"; then
            echo "Tagged ${tag}"
          elif printf '%s' "$out" | grep -q 'Reference already exists'; then
            echo "${tag} already exists"
          else
            # The rollout itself succeeded; a missing tag is fixed by hand, not by a rollback.
            echo "::warning::could not create tag ${tag}: ${out}"
          fi
          echo "Tag \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back after a failed public check
        if: failure() && steps.verify.outcome == 'failure'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 "${ORACLE_USER}@${ORACLE_HOST}" \
            "s=\$(mktemp) && cat > \"\$s\" && bash \"\$s\" rollback; rc=\$?; rm -f \"\$s\"; exit \$rc" \
            < droneaid/deploy/rollout.sh
          echo "::error::Rolled back: ${IMAGE} failed the public health check."
          exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/oracle_key
